services:
  minecraft:
    # ATENÇÃO: a tag do Java e MC_VERSION são ACOPLADAS. Cada versão do
    # Minecraft exige uma versão mínima de Java, e se a imagem tiver Java
    # velho o servidor sai com exitCode 1 em loop de restart, sem nunca abrir
    # a porta. Exemplo real: MC 26.1 exige Java 25; com a tag java21 ele nem
    # inicia. Tags disponíveis: java8, java11, java17, java21, java25.
    # Java 25 roda tudo que é moderno — não baixe esta tag sem motivo.
    image: itzg/minecraft-server:${MC_IMAGE_TAG:-java25}
    restart: unless-stopped

    # O console do servidor precisa de TTY para aceitar comandos via
    # `docker attach`. Sem isto, `mc-send-to-console` e o console interativo
    # não funcionam.
    tty: true
    stdin_open: true

    # Minecraft Java é TCP bruto, NÃO é HTTP — não passa pelo Traefik do
    # Coolify. Deixe o campo de domínio VAZIO no Coolify e libere a porta
    # no firewall do VPS: sudo ufw allow 25565/tcp
    ports:
      - "${MC_PORT:-25565}:25565"

    environment:
      # --- Obrigatório ---------------------------------------------------
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-LATEST}"

      # --- Memória -------------------------------------------------------
      # MC_MAX_MEMORY deve ficar em ~75% de MC_MEM_LIMIT. Metaspace, buffers
      # do Netty, threads e overhead de GC vivem FORA do heap e contam para o
      # limite do cgroup. Heap igual ao limite = OOM-kill silencioso.
      MAX_MEMORY: "${MC_MAX_MEMORY:-3G}"
      USE_AIKAR_FLAGS: "TRUE"

      # --- Alavancas de CPU (as que mais importam em 2 vCPU) --------------
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-7}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-5}"

      # Desarma o watchdog. Em CPU limitada ele derruba o servidor em picos
      # de tick que são legítimos (geração de chunk, save de mundo).
      MAX_TICK_TIME: "-1"

      # --- Gameplay ------------------------------------------------------
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-10}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MODE: "${MC_MODE:-survival}"
      MOTD: "${MC_MOTD:-Servidor Paper}"
      LEVEL: "${MC_LEVEL:-world}"

      # Semente do mundo. SÓ TEM EFEITO NA GERAÇÃO DO MUNDO — se o mundo em
      # LEVEL já existe, é ignorada em silêncio. Para trocar de semente,
      # aponte LEVEL para um nome novo (ex: world2) ou apague /data/world.
      # Vazio = semente aleatória.
      SEED: "${MC_SEED:-}"
      SPAWN_PROTECTION: "${MC_SPAWN_PROTECTION:-0}"

      # Reaplica as variáveis acima no server.properties a cada restart.
      # Sem isto, mudanças de env são ignoradas depois do primeiro boot.
      OVERRIDE_SERVER_PROPERTIES: "TRUE"

      # --- Acesso --------------------------------------------------------
      # FALSE = aceita clientes sem conta Microsoft/Mojang (pirata).
      #
      # O QUE ISSO CUSTA: sem autenticação, o servidor aceita QUALQUER nome
      # que o cliente digitar. Alguém pode entrar usando o seu nick. Se esse
      # nick for op, a pessoa entra como op — e op apaga o mundo, banha todos
      # e muda a config. A whitelist tambem deixa de proteger: ela compara
      # nome, e o nome é exatamente o que passou a ser falsificável.
      #
      # MITIGAÇÕES OBRIGATÓRIAS quando isto é FALSE (ver README):
      #   1. NAO preencher MC_OPS — dar op por RCON, com a pessoa online
      #   2. Manter MC_ENABLE_WHITELIST=TRUE
      #   3. Trocar MC_PORT para uma porta fora da 25565 (foge de scanners)
      #   4. Instalar plugin de login (AuthMe/nLogin) — é o que devolve
      #      autenticacao de verdade, por senha
      ONLINE_MODE: "${MC_ONLINE_MODE:-FALSE}"

      # Com ONLINE_MODE=FALSE, deixe VAZIO. Um op pré-definido por nome é
      # uma conta de administrador com senha em branco na internet.
      OPS: "${MC_OPS:-}"
      ENABLE_WHITELIST: "${MC_ENABLE_WHITELIST:-TRUE}"
      WHITELIST: "${MC_WHITELIST:-}"

      # --- RCON ----------------------------------------------------------
      # Habilitado, mas a porta 25575 NÃO é exposta ao host de propósito.
      # Administração via `docker exec` — ver README. RCON aberto na internet
      # é vetor de invasão direto.
      ENABLE_RCON: "TRUE"
      # O `:?` faz o deploy falhar alto se a senha nao existir, em vez de
      # subir com senha vazia. Se o Coolify recusar SALVAR o compose por
      # causa disto (ele interpola na leitura, antes de voce preencher as env
      # vars), preencha RCON_PASSWORD na aba Environment Variables primeiro —
      # ou troque por "${RCON_PASSWORD}" simples.
      RCON_PASSWORD: "${RCON_PASSWORD:?defina RCON_PASSWORD nas variaveis de ambiente}"

      # --- Autopause (opt-in) --------------------------------------------
      # Suspende a JVM quando ninguém está online, devolvendo a CPU ao host.
      # Trade-off: a primeira conexão depois da pausa costuma expirar e o
      # jogador precisa tentar de novo.
      # ATENÇÃO: ao ligar isto, COMENTE o bloco `healthcheck` abaixo. O
      # mc-health abre conexão na porta a cada 30s, e o autopause interpreta
      # isso como atividade — o servidor nunca pausa (ou acorda em loop).
      ENABLE_AUTOPAUSE: "${MC_ENABLE_AUTOPAUSE:-FALSE}"
      AUTOPAUSE_TIMEOUT_EST: "${MC_AUTOPAUSE_TIMEOUT:-1800}"

      TZ: "${TZ:-America/Sao_Paulo}"

    volumes:
      # OBRIGATÓRIO. Sem volume, o próximo redeploy do Coolify apaga o mundo.
      - minecraft-data:/data

    # A janela default de 10s do Docker entre SIGTERM e SIGKILL corta o save
    # do mundo no meio do flush e corrompe chunks.
    stop_grace_period: 60s

    # O Compose v2 honra deploy.resources.limits fora do swarm, mas o Coolify
    # transforma o compose antes de rodar. VERIFIQUE depois do deploy (ver
    # README). Se os limites nao aplicarem, troque este bloco pelas chaves
    # `mem_limit` e `cpus` no nivel do servico — uma OU outra, nunca as duas.
    deploy:
      resources:
        limits:
          memory: ${MC_MEM_LIMIT:-4G}
          cpus: "${MC_CPU_LIMIT:-1.5}"

    healthcheck:
      test: ["CMD", "mc-health"]
      # A primeira inicialização baixa o Paper e gera o mundo — é lenta.
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------
  # Painel web de controle (Next.js + RCON), protegido por Basic Auth
  # ---------------------------------------------------------------------
  panel:
    build:
      context: ./panel
    restart: unless-stopped

    environment:
      # Alcança o servidor de jogo pelo nome do serviço, na rede interna do
      # compose. A porta 25575 continua SEM publicacao no host — o painel
      # entra por dentro. Por isso o painel tem que estar NESTE compose: um
      # recurso separado no Coolify fica em outra rede e nao alcanca.
      RCON_HOST: "minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?defina RCON_PASSWORD nas variaveis de ambiente}"

      # Autenticacao do painel: Basic Auth com senha compartilhada.
      # Sem PANEL_PASSWORD o painel recusa TODA requisicao — falha fechada.
      # Um painel sem senha por engano e pior que um painel fora do ar.
      PANEL_USER: "${PANEL_USER:-admin}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:?defina PANEL_PASSWORD nas variaveis de ambiente}"

      TZ: "${TZ:-America/Sao_Paulo}"

    volumes:
      # SOMENTE LEITURA. O painel le o server.properties para saber o estado
      # real da whitelist, do online-mode e das distancias — o RCON nao tem
      # comando que responda isso (`whitelist list` devolve os nomes tanto
      # ligada quanto desligada). O `:ro` garante que o painel nao escreve no
      # mundo nem por engano de codigo.
      - minecraft-data:/mc:ro

    # `expose`, nao `ports`: o painel so e alcancavel pelo Traefik, entao nao
    # existe um caminho IP:porta que chegue nele sem passar pelo dominio.
    expose:
      - "3000"

    depends_on:
      - minecraft

    deploy:
      resources:
        limits:
          memory: ${PANEL_MEM_LIMIT:-256M}
          cpus: "${PANEL_CPU_LIMIT:-0.3}"

volumes:
  minecraft-data:
